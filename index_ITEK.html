<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ITEK Vault — Query Interface</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #1f2937;
      background: #f9fafb;
    }
    h1 {
      font-size: 1.8rem;
      color: #111827;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      resize: vertical;
      margin-bottom: 1rem;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    #status {
      margin: 1rem 0;
      font-style: italic;
      color: #4b5563;
    }
    #answer {
      background: white;
      padding: 1.25rem;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      margin: 1.5rem 0;
      white-space: pre-wrap;
    }
    #references {
      margin-top: 2rem;
    }
    .ref-item {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
      position: relative;
    }
    .ref-item::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #2563eb;
    }
    #loading {
      display: none;
      text-align: center;
      color: #6b7280;
      margin: 2rem 0;
    }
  </style>
</head>
<body>

  <h1>ITEK Vault — A Collection of Indigenous Traditional Ecological Knowledge</h1>

  <form id="queryForm">
    <textarea id="query" placeholder="Ask a question about Indigenous Traditional Ecological Knowledge..." required></textarea>
    <div style="text-align: center;">
      <button type="submit" id="submitBtn">Ask ITEK Vault</button>
    </div>
  </form>

  <div id="status"></div>
  <div id="loading">Thinking...</div>

  <div id="answer"></div>
  <div id="references"></div>

  <script>
    const form = document.getElementById('queryForm');
    const queryInput = document.getElementById('query');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const loadingDiv = document.getElementById('loading');
    const answerDiv = document.getElementById('answer');
    const refsDiv = document.getElementById('references');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const query = queryInput.value.trim();
      if (!query) return;

      // Reset UI
      answerDiv.innerHTML = '';
      refsDiv.innerHTML = '';
      statusDiv.textContent = '';
      loadingDiv.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const data = await res.json();

        // Show answer
        answerDiv.innerHTML = `<strong>Answer:</strong><br><br>${data.answer.replace(/\n/g, '<br>')}`;

        // Show references
        if (data.references && data.references.length > 0) {
          refsDiv.innerHTML = '<h3>References</h3>';
          data.references.forEach(ref => {
            const p = document.createElement('p');
            p.className = 'ref-item';
            p.textContent = ref;
            refsDiv.appendChild(p);
          });
        } else {
          refsDiv.innerHTML = '<p style="color:#6b7280;">No references returned.</p>';
        }

      } catch (err) {
        statusDiv.textContent = `Error: ${err.message}`;
        statusDiv.style.color = '#dc2626';
      } finally {
        loadingDiv.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
